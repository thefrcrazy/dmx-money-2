[package]
name = "dmx-ffi"
description = "Façade UniFFI de dmx-core (Swift, C#)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lib]
name = "dmx_ffi"
crate-type = ["lib", "staticlib", "cdylib"]

[features]
default = ["bridge"]
# Pont compagnon PWA : desktop uniquement (exclu des builds iOS).
bridge = ["dep:dmx-bridge"]

[dependencies]
dmx-core = { path = "../dmx-core" }
dmx-bridge = { path = "../dmx-bridge", optional = true }
chrono.workspace = true
log.workspace = true
thiserror.workspace = true
uniffi = "0.31"
