name: Release

on:
  push:
    tags: ['v2.*']
  workflow_dispatch:
    inputs:
      version:
        description: "Version à construire (par défaut : fichier VERSION)"
        required: false
      prerelease:
        description: "Publier en pré-version"
        type: boolean
        default: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Secret d'enregistrement du pont managé : compilé dans le noyau (option_env!).
  DMXMONEY_MANAGED_BRIDGE_REGISTRATION_SECRET: ${{ secrets.DMXMONEY_MANAGED_BRIDGE_REGISTRATION_SECRET }}
  DMXMONEY_MANAGED_BRIDGE_URL: ${{ secrets.DMXMONEY_MANAGED_BRIDGE_URL }}

jobs:
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$REQUESTED_VERSION" ]; then
            version="$REQUESTED_VERSION"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(cat VERSION)"
          fi
          if ! [[ "$version" =~ ^2\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Version invalide : 2.x.y ou 2.x.y-prerelease requis."
            exit 1
          fi
          if [ "$version" != "$(cat VERSION)" ]; then
            echo "::error::La version demandée doit correspondre à VERSION avant toute construction."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "==> version $version"

  macos:
    name: macOS (DMG Apple Silicon et Intel)
    needs: version
    # Xcode 26 par défaut : la variante modern cible macOS 26 (voir ci.yml).
    runs-on: macos-26
    env:
      # Le contexte `secrets` n'est pas lisible dans un `if` d'étape : on le copie ici.
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim
      - run: brew install xcodegen create-dmg
      - name: Noyau et bindings Swift
        run: ./scripts/build-apple-xcframework.sh

      - name: Identité de signature
        id: signing
        if: ${{ env.APPLE_CERTIFICATE_P12 != '' }}
        env:
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > /tmp/certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm /tmp/certificate.p12
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Réglages locaux (signature, iCloud, flux de mise à jour)
        env:
          # Sans secret, le flux est celui des releases GitHub du dépôt, où updates.json est publié.
          FEED_URL: ${{ secrets.DMX_UPDATE_FEED_URL || format('https://api.github.com/repos/{0}/releases', github.repository) }}
        run: |
          # Un xcconfig lit « // » comme un commentaire : l'URL s'y écrit « /$()/ ». sed plutôt que
          # ${var//…/…}, dont le bash 3.2 de macOS garde les antislashs du remplacement.
          ESCAPED_FEED_URL="$(printf '%s' "$FEED_URL" | sed 's#//#/$()/#')"
          {
            echo "DEVELOPMENT_TEAM = ${{ secrets.APPLE_TEAM_ID }}"
            echo "DMX_ENTITLEMENTS_SUFFIX = ${{ secrets.APPLE_TEAM_ID != '' && '-iCloud' || '' }}"
            echo "DMX_ICLOUD_CONTAINER = ${{ secrets.DMX_ICLOUD_CONTAINER }}"
            echo "DMX_UPDATE_FEED_URL = $ESCAPED_FEED_URL"
          } > apple/Config/Signing.local.xcconfig
          cat apple/Config/Signing.local.xcconfig
          cd apple && xcodegen generate

      # Le projet Xcode embarque pwa/dist (la PWA servie par le pont local), qui n'est pas versionné.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Client PWA du compagnon
        run: ./scripts/build-pwa.sh

      # Deux builds séparés, comme en DmxMoney 1.x : Apple Silicon (macOS 26+) et
      # Intel/Catalina (macOS 10.15+). Aucun binaire universel n'est publié.
      - name: Build modern (Apple Silicon) et legacy (Intel/Catalina)
        run: |
          SKIP_CORE=1 ./scripts/build-macos.sh modern
          SKIP_CORE=1 ./scripts/build-macos.sh legacy
          lipo -info dist/modern/DmxMoney.app/Contents/MacOS/DmxMoney
          lipo -info dist/legacy/DmxMoney.app/Contents/MacOS/DmxMoney

      - name: Signature et notarisation
        if: ${{ steps.signing.outputs.signed == 'true' && env.APPLE_API_KEY != '' }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ICLOUD_CONTAINER: ${{ secrets.DMX_ICLOUD_CONTAINER }}
        run: |
          python3 - <<'PYTHON'
          import os, plistlib, re
          from pathlib import Path
          source = Path('apple/DmxMoney-macOS/DmxMoney.entitlements')
          if os.environ.get('APPLE_TEAM_ID'):
              source = source.with_name('DmxMoney-iCloud.entitlements')
              container = os.environ.get('ICLOUD_CONTAINER', '')
              if not re.fullmatch(r'iCloud\.[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)*', container):
                  raise SystemExit('Conteneur iCloud valide requis pour les entitlements de publication.')
          entitlements = plistlib.loads(source.read_bytes())
          if os.environ.get('APPLE_TEAM_ID'):
              entitlements['com.apple.developer.icloud-container-identifiers'] = [container]
          encoded = plistlib.dumps(entitlements)
          if b'$(' in encoded:
              raise SystemExit('Variable Xcode non développée dans les entitlements de publication.')
          Path('/tmp/DmxMoney-release.entitlements').write_bytes(encoded)
          PYTHON
          echo "$APPLE_API_KEY" | base64 --decode > /tmp/AuthKey.p8
          for variant in modern legacy; do
            codesign --force --deep --options runtime --timestamp \
              --entitlements /tmp/DmxMoney-release.entitlements \
              --sign "Developer ID Application" "dist/$variant/DmxMoney.app"
            ditto -c -k --keepParent "dist/$variant/DmxMoney.app" "/tmp/DmxMoney-$variant.zip"
            xcrun notarytool submit "/tmp/DmxMoney-$variant.zip" --wait \
              --key /tmp/AuthKey.p8 --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER"
            xcrun stapler staple "dist/$variant/DmxMoney.app"
          done
          rm /tmp/AuthKey.p8

      - name: DMG (Apple Silicon et Intel/Catalina)
        run: |
          version="${{ needs.version.outputs.version }}"
          mkdir -p artifacts
          # create-dmg copie le contenu du dossier source : on lui passe le dossier qui contient l'app.
          create-dmg --volname "DmxMoney $version" \
            --app-drop-link 420 180 --window-size 620 360 --icon DmxMoney.app 180 180 \
            "artifacts/DmxMoney-$version-apple-silicon.dmg" dist/modern
          create-dmg --volname "DmxMoney $version (Intel)" \
            --app-drop-link 420 180 --window-size 620 360 --icon DmxMoney.app 180 180 \
            "artifacts/DmxMoney-$version-intel-catalina.dmg" dist/legacy

      - name: Flux de mise à jour
        run: |
          python3 scripts/update-feed.py "${{ needs.version.outputs.version }}" "${{ github.repository }}" \
            > artifacts/updates.json
          cat artifacts/updates.json

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: artifacts
          if-no-files-found: error

  windows:
    name: Windows (${{ matrix.rid }})
    needs: version
    # Visual Studio 2026, comme dans ci.yml : compilation XAML en processus et ciblage de .NET 10.
    runs-on: windows-2025-vs2026
    environment: windows-signing
    permissions:
      contents: read
      id-token: write
    env:
      WINDOWS_SIGNING_MODE: ${{ vars.WINDOWS_SIGNING_MODE || 'public-trust' }}
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - name: Mode de signature Windows explicite
        run: |
          if ($env:WINDOWS_SIGNING_MODE -notin @('public-trust', 'self-signed')) {
            throw 'WINDOWS_SIGNING_MODE doit être public-trust ou self-signed.'
          }
      - name: Configuration de signature publique obligatoire
        if: env.WINDOWS_SIGNING_MODE == 'public-trust'
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          SIGNING_ENDPOINT: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.WINDOWS_SIGNING_PROFILE }}
        run: |
          foreach ($name in @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'AZURE_SUBSCRIPTION_ID', 'SIGNING_ENDPOINT', 'SIGNING_ACCOUNT', 'SIGNING_PROFILE')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Signature Windows non configurée ($name). Créez un profil Azure Artifact Signing Public Trust et les variables de l'environnement windows-signing ; la release ne publiera pas d'installeur non signé."
            }
          }
      - uses: azure/login@v2
        if: env.WINDOWS_SIGNING_MODE == 'public-trust'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          # Le client de signature Microsoft nécessite le runtime .NET 8 x64.
          dotnet-version: |
            8.0.x
            10.0.x
      - run: cargo install uniffi-bindgen-cs --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag v0.11.0+v0.31.0 --locked
      # Même version que le paquet Velopack de l'app (DmxMoney.App.csproj).
      - run: dotnet tool install -g vpk --version 0.0.1298
      - name: Client Microsoft et métadonnées de signature
        id: signing
        if: env.WINDOWS_SIGNING_MODE == 'public-trust'
        env:
          SIGNING_ENDPOINT: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.WINDOWS_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.WINDOWS_SIGNING_PROFILE }}
        run: |
          ./scripts/prepare-windows-signing.ps1 -Endpoint $env:SIGNING_ENDPOINT -AccountName $env:SIGNING_ACCOUNT -CertificateProfileName $env:SIGNING_PROFILE -OutputDirectory (Join-Path $env:RUNNER_TEMP 'windows-signing')
      - name: Identité autosignée stable (sans ajout de confiance)
        if: env.WINDOWS_SIGNING_MODE == 'self-signed'
        id: self_signing
        env:
          WINDOWS_SELF_SIGNED_PFX: ${{ secrets.WINDOWS_SELF_SIGNED_PFX }}
          WINDOWS_SELF_SIGNED_PASSWORD: ${{ secrets.WINDOWS_SELF_SIGNED_PASSWORD }}
          EXPECTED_THUMBPRINT: ${{ vars.WINDOWS_SELF_SIGNED_THUMBPRINT }}
        run: |
          foreach ($name in @('WINDOWS_SELF_SIGNED_PFX', 'WINDOWS_SELF_SIGNED_PASSWORD', 'EXPECTED_THUMBPRINT')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Identité autosignée stable non configurée ($name). Aucun certificat temporaire ne sera publié."
            }
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'dmxmoney-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SELF_SIGNED_PFX))
            $password = ConvertTo-SecureString $env:WINDOWS_SELF_SIGNED_PASSWORD -AsPlainText -Force
            try {
              $certificate = ./scripts/prepare-windows-self-signed-release.ps1 -PfxPath $pfxPath `
                -PfxPassword $password -ExpectedThumbprint $env:EXPECTED_THUMBPRINT `
                -PublicCertificatePath (Join-Path $env:RUNNER_TEMP 'dmxmoney-public.cer')
              "thumbprint=$($certificate.Thumbprint)" >> $env:GITHUB_OUTPUT
            }
            finally { if ($password) { $password.Dispose() } }
          }
          finally {
            if (Test-Path -LiteralPath $pfxPath) { Remove-Item -LiteralPath $pfxPath -Force }
          }
      - name: Application et installeur Public Trust
        if: env.WINDOWS_SIGNING_MODE == 'public-trust'
        env:
          SIGN_TOOL: ${{ steps.signing.outputs.signtool }}
          SIGNING_DLIB: ${{ steps.signing.outputs.dlib }}
          SIGNING_METADATA: ${{ steps.signing.outputs.metadata }}
        run: |
          ./scripts/build-windows.ps1 -Rid ${{ matrix.rid }} -Version ${{ needs.version.outputs.version }} -RequireSigning -SignToolPath $env:SIGN_TOOL -SigningDlibPath $env:SIGNING_DLIB -SigningMetadataPath $env:SIGNING_METADATA
      - name: Application et installeur autosigné
        if: env.WINDOWS_SIGNING_MODE == 'self-signed'
        env:
          SIGNING_THUMBPRINT: ${{ steps.self_signing.outputs.thumbprint }}
        run: |
          ./scripts/build-windows.ps1 -Rid ${{ matrix.rid }} -Version ${{ needs.version.outputs.version }} `
            -DevelopmentCertificateThumbprint $env:SIGNING_THUMBPRINT -SelfSignedRelease
      - name: Suppression de la clé de signature du runner
        if: always() && env.WINDOWS_SIGNING_MODE == 'self-signed'
        env:
          SIGNING_THUMBPRINT: ${{ steps.self_signing.outputs.thumbprint }}
        run: |
          if ($env:SIGNING_THUMBPRINT) {
            Remove-Item -LiteralPath "Cert:/CurrentUser/My/$env:SIGNING_THUMBPRINT" -DeleteKey -Force
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.rid }}
          path: target/windows/${{ env.WINDOWS_SIGNING_MODE == 'self-signed' && 'self-signed-releases' || 'releases' }}/${{ matrix.rid }}
          if-no-files-found: error

  linux:
    name: Linux (AppImage)
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libdbus-1-dev \
                                  libfuse2t64 desktop-file-utils
      - name: Client PWA du compagnon
        run: |
          curl -fsSL https://bun.sh/install | bash
          export PATH="$HOME/.bun/bin:$PATH"
          cd pwa && bun install --frozen-lockfile && bun run build
      - name: appimagetool
        run: |
          sudo curl -fsSL -o /usr/local/bin/appimagetool \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
      - name: AppImage
        env:
          # Pas de FUSE sur les runners : l'outil s'extrait avant de s'exécuter.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: ./scripts/build-linux-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: target/appimage/*.AppImage
          if-no-files-found: error

  flatpak:
    name: Linux (Flatpak)
    needs: version
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: PWA embarquée
        working-directory: pwa
        run: bun install --frozen-lockfile && bun run build
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@master
        with:
          bundle: com.dmxmoney.app.flatpak
          manifest-path: linux/flatpak/com.dmxmoney.app.yml
          cache-key: flatpak-builder-${{ github.sha }}

  publish:
    name: Publication
    needs: [version, macos, windows, linux, flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      # download-artifact abandonne dès un 403 renvoyé par un intermédiaire réseau, souvent passager
      # (vécu à la publication de la 2.0.0) : une seconde tentative suit un premier échec.
      - uses: actions/download-artifact@v4
        id: download
        continue-on-error: true
        with:
          path: artifacts
      - uses: actions/download-artifact@v4
        if: steps.download.outcome == 'failure'
        with:
          path: artifacts
      - name: Notes de version
        run: |
          version="${{ needs.version.outputs.version }}"
          python3 scripts/release-notes.py "$version" > notes.md
          find artifacts -type f | sort
      - name: Release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          version="${{ needs.version.outputs.version }}"
          # Les assets d'une release doivent porter des noms uniques.
          duplicates="$(find artifacts -type f -printf '%f\n' | sort | uniq -d)"
          if [ -n "$duplicates" ]; then
            echo "::error::Noms d'assets en double : $duplicates"
            exit 1
          fi
          flags=()
          if [ "$PRERELEASE" = "true" ] || [[ "$version" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "v$version" --target "$GITHUB_SHA" --title "DmxMoney $version" \
            --notes-file notes.md "${flags[@]}" $(find artifacts -type f | tr '\n' ' ')
