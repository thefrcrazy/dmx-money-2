name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  core:
    name: Noyau Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Politique de préversions et notes de publication
        run: python3 scripts/tests/test-release-policy.py
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Dépendances système (trousseau du pont)
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy -p dmx-core -p dmx-bridge -p dmx-ffi --all-targets -- -D warnings
      - name: Tests
        run: cargo test -p dmx-core -p dmx-bridge -p dmx-ffi

  web:
    name: PWA et Worker
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Dépendances verrouillées
        working-directory: pwa
        run: bun install --frozen-lockfile
      - name: Typage, tests et build PWA
        working-directory: pwa
        run: |
          bunx tsc --noEmit
          bun test
          bun run build
      - name: Dépendances du relais distant
        working-directory: cloudflare/remote-relay
        run: bun install --frozen-lockfile
      - name: Typage et tests du relais Cloudflare
        working-directory: cloudflare/remote-relay
        run: |
          bun run assets
          bun run pages:assets
          bun run check
          bun run test
          bun run dry-run

  linux:
    name: Linux (GTK4 / libadwaita)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libadwaita-1-dev libdbus-1-dev \
                                  desktop-file-utils appstream xvfb xauth
      - name: Icônes natives à jour (Windows, Apple, Linux)
        run: python3 scripts/gen-native-icons.py --check
      - name: Icône de l'application
        run: ./scripts/gen-linux-icons.sh
      # L'icône d'app en PNG est redimensionnée par sips sur macOS et par ImageMagick ici : les
      # octets diffèrent d'une plateforme à l'autre sans que l'image change, on ne la compare donc pas.
      - name: Le thème d'icônes versionné est à jour
        run: |
          git diff --exit-code -- linux/dmx-money-gtk/data/icons/hicolor/index.theme
          git checkout -- linux/dmx-money-gtk/data/icons
      - name: Clippy
        run: cargo clippy -p dmx-money-gtk --all-targets -- -D warnings
      - name: Fermeture et libération des contrôles GTK
        run: xvfb-run -a cargo test -p dmx-money-gtk --features ui-tests --test ui-lifecycle --locked
      - name: Build release
        run: cargo build --release -p dmx-money-gtk
      - name: Installation dans un préfixe de test
        run: ./scripts/install-linux.sh "$PWD/target/prefix" target/release/dmx-money-gtk
      - name: Validation des métadonnées de bureau
        run: |
          desktop-file-validate target/prefix/share/applications/com.dmxmoney.app.desktop
          appstreamcli validate --no-net target/prefix/share/metainfo/com.dmxmoney.app.metainfo.xml
      - uses: actions/upload-artifact@v4
        with:
          name: dmx-money-gtk-linux-x64
          path: target/prefix
          if-no-files-found: error

  apple:
    name: Apple (macOS, iOS)
    # macos-26 : Xcode 26 par défaut, comme en local. L'image macos-15 reste sur Xcode 16.4, sans le
    # SDK macOS 26 dont la variante modern a besoin (SwiftUI 26, FoundationModels).
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: Cibles Rust Apple
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim
      - name: XcodeGen
        run: brew install xcodegen
      - name: Noyau et bindings Swift
        run: ./scripts/build-apple-xcframework.sh
      - name: Tests DmxKit
        run: swift test --package-path apple/Packages/DmxKit
      - name: Défilement et édition du journal (30 000 opérations fictives)
        env:
          DMXMONEY_JOURNAL_TEST_OUTPUT: ${{ runner.temp }}/dmx-journal-render
        run: python3 scripts/tests/test-macos-journal.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-journal-performance
          path: |
            ${{ runner.temp }}/dmx-journal-render/*.json
            ${{ runner.temp }}/dmx-journal-render/*.png
            ${{ runner.temp }}/dmx-journal-render/*.log
            ${{ runner.temp }}/dmx-journal-render/*.stderr
          if-no-files-found: warn
      - name: Projet Xcode
        run: cd apple && xcodegen generate
      - name: macOS modern (Apple Silicon, macOS 26 Tahoe)
        run: SKIP_CORE=1 ./scripts/build-macos.sh modern
      - name: macOS legacy (Intel, macOS 10.15 Catalina)
        run: SKIP_CORE=1 ./scripts/build-macos.sh legacy
      - name: Interface AppKit et icônes Catalina (clair, sombre, paramètres)
        run: ./scripts/verify-apple-ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apple-ui-catalina-artwork
          path: |
            target/apple-ui-verification/screenshots.*/*.png
            target/apple-ui-verification/build.log
          if-no-files-found: warn
      - name: iOS (simulateur arm64)
        run: |
          xcodebuild -project apple/DmxMoney.xcodeproj -scheme DmxMoney-iOS \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            ARCHS=arm64 ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build

  windows:
    name: Windows (WinUI 3)
    # Visual Studio 2026 : son MSBuild compile le XAML en processus et cible .NET 10 (voir
    # scripts/build-windows.ps1) ; Visual Studio 2022 ne prend pas en charge .NET 10.
    runs-on: windows-2025-vs2026
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            8.0.x
      - name: Contrôles des scripts de distribution Windows
        run: pwsh scripts/tests/test-windows-release.ps1
      - name: uniffi-bindgen-cs
        run: cargo install uniffi-bindgen-cs --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag v0.11.0+v0.31.0 --locked
      - name: Outil de packaging Velopack
        run: dotnet tool install -g vpk --version 0.0.1298
      - name: Noyau, bindings, application et paquet autosigné de test
        run: |
          $testCertificate = ./scripts/new-windows-development-certificate.ps1 `
            -PublicCertificatePath (Join-Path $env:RUNNER_TEMP 'DmxMoney-ci-signing.cer') -ValidDays 1
          try {
            ./scripts/build-windows.ps1 -Rid win-x64 `
              -DevelopmentCertificateThumbprint $testCertificate.Thumbprint -SelfSignedRelease -EphemeralSigningIdentity
          }
          finally {
            Remove-Item -LiteralPath "Cert:/CurrentUser/My/$($testCertificate.Thumbprint)" -DeleteKey -Force
          }
      - name: Tests (noyau et modèles de vue)
        run: dotnet test windows/tests/DmxMoney.Tests/DmxMoney.Tests.csproj --configuration Release
      - name: Réaffectation et annulation des cellules éditables
        run: dotnet run --project windows/tests/EditableCellHarness/EditableCellHarness.csproj --configuration Release -p:UseSharedCompilation=false
      # Test de démarrage : l'app publiée ouvre chaque page tour à tour puis quitte d'elle-même
      # (DMXMONEY_SELF_TEST). Une page qui plante ferme le processus avec un crash.log, alors affiché
      # (vécu avec les pré-versions 2.0.0 au démarrage et 2.0.1 au changement de page).
      - name: Démarrage de l'application et tour des pages
        env:
          DMXMONEY_DATA_DIR: ${{ runner.temp }}\dmx-smoke
          DMXMONEY_NO_DIALOG: '1'
          DMXMONEY_SELF_TEST: '1'
        run: |
          $app = Start-Process -FilePath (Resolve-Path target/windows/win-x64/DmxMoney.exe) -PassThru
          $null = $app.Handle
          $finished = $app.WaitForExit(120000)
          $log = Join-Path $env:LOCALAPPDATA 'DmxMoney/crash.log'
          if (Test-Path $log) { Get-Content $log }
          if (-not $finished) {
            Stop-Process -Id $app.Id -Force
            throw "Le tour des pages ne s'est pas terminé en 2 minutes."
          }
          if ($app.ExitCode -ne 0 -or (Test-Path $log)) {
            throw "L'application a planté pendant le tour des pages (code $($app.ExitCode))."
          }
          Write-Host "==> Toutes les pages se sont ouvertes sans erreur."
      - uses: actions/upload-artifact@v4
        with:
          name: dmxmoney-win-x64
          path: target/windows/win-x64
          if-no-files-found: error
