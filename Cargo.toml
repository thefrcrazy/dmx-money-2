[workspace]
resolver = "2"
members = [
    "core/crates/dmx-core",
    "core/crates/dmx-bridge",
    "core/crates/dmx-ffi",
    "core/crates/uniffi-bindgen",
    "linux/dmx-money-gtk",
    "tools/seed-demo",
]
default-members = ["core/crates/dmx-core", "core/crates/dmx-bridge", "core/crates/dmx-ffi"]

[workspace.package]
version = "2.1.0-rc.2"
edition = "2021"
rust-version = "1.94"
license = "MIT"
authors = ["Maxim Collignon"]
repository = "https://github.com/thefrcrazy/dmx-money-2"

[workspace.dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
dirs = "6"
log = "0.4"
libsqlite3-sys = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "=0.9.0", default-features = false, features = ["sqlite", "runtime-tokio"] }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4", "v5"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
